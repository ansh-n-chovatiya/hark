name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  source:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release && swift test
      - run: scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: build/hark-source.zip
          generate_release_notes: true
